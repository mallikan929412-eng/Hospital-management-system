<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCare HMS – Hospital Management System</title>
    <meta name="description"
        content="MedCare HMS: A comprehensive hospital management system for patient registration, doctor assignment, billing, and analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/patients.css" />
    <link rel="stylesheet" href="css/doctors.css" />
    <link rel="stylesheet" href="css/billing.css" />
    <link rel="stylesheet" href="css/modals.css" />
    <link rel="stylesheet" href="css/ai-assistant.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="12" fill="url(#logoGrad)" />
                        <path d="M20 8v24M8 20h24" stroke="white" stroke-width="4" stroke-linecap="round" />
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3B82F6" />
                                <stop offset="1" stop-color="#8B5CF6" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-name">MedCare</span>
                    <span class="logo-sub">HMS</span>
                </div>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">MAIN MENU</div>
            <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                </span>
                <span class="nav-label">Dashboard</span>
                <span class="nav-badge" id="badge-dashboard"></span>
            </a>
            <a href="#" class="nav-item" data-page="patients" id="nav-patients">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                <span class="nav-label">Patients</span>
                <span class="nav-badge" id="badge-patients"></span>
            </a>
            <a href="#" class="nav-item" data-page="doctors" id="nav-doctors">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                        <path d="M12 11v4m-2-2h4" />
                    </svg>
                </span>
                <span class="nav-label">Doctors</span>
                <span class="nav-badge" id="badge-doctors"></span>
            </a>
            <a href="#" class="nav-item" data-page="appointments" id="nav-appointments">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                </span>
                <span class="nav-label">Appointments</span>
                <span class="nav-badge appointment-badge" id="badge-appointments">0</span>
            </a>

            <div class="nav-section-label">OPERATIONS</div>
            <a href="#" class="nav-item" data-page="billing" id="nav-billing">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                        <line x1="1" y1="10" x2="23" y2="10" />
                    </svg>
                </span>
                <span class="nav-label">Billing</span>
                <span class="nav-badge" id="badge-billing"></span>
            </a>
            <a href="#" class="nav-item" data-page="reports" id="nav-reports">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                </span>
                <span class="nav-label">Reports</span>
                <span class="nav-badge" id="badge-reports"></span>
            </a>
            <a href="#" class="nav-item" data-page="inventory" id="nav-inventory">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                    </svg>
                </span>
                <span class="nav-label">Inventory</span>
                <span class="nav-badge" id="badge-inventory"></span>
            </a>

            <div class="nav-section-label">SYSTEM</div>
            <a href="#" class="nav-item" data-page="settings" id="nav-settings">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar" id="userAvatarSidebar">DA</div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Dr. Admin</span>
                    <span class="user-role">Administrator</span>
                </div>
                <button class="user-menu-btn" title="User Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="globalSearch" placeholder="Search patients, doctors, invoices..." />
                    <kbd class="search-shortcut">⌘K</kbd>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary btn-sm" id="topbarAiVoiceBtn" onclick="HMS_AI.togglePanel()"
                    style="background: linear-gradient(135deg, #3B82F6, #8B5CF6); border-radius: 999px; padding: 6px 14px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 16px rgba(59, 130, 246, 0.4); border: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="width:14px;height:14px;">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                    </svg>
                    <span>Ask AI Copilot</span>
                </button>
                <button class="topbar-btn" id="notifBtn" title="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span class="notif-dot" id="notifDot"></span>
                </button>
                <button class="topbar-btn" title="Theme Toggle" id="themeToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
                <div class="topbar-divider"></div>
                <div class="topbar-user">
                    <div class="topbar-avatar" id="topbarAvatar">DA</div>
                    <div class="topbar-user-info">
                        <span class="topbar-user-name" id="topbarUserName">Dr. Admin</span>
                        <span class="topbar-user-role">Administrator</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Notification Panel -->
        <div class="notif-panel" id="notifPanel">
            <div class="notif-header">
                <h3>Notifications</h3>
                <button id="markAllRead">Mark all read</button>
            </div>
            <div class="notif-list" id="notifList"></div>
        </div>

        <!-- Page Content -->
        <div class="page-content" id="pageContent">
            <!-- Pages injected by JS -->
        </div>
    </main>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer">
            <div class="modal-header" id="modalHeader">
                <h2 id="modalTitle">Modal</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <span>Loading...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/patients.js"></script>
    <script src="js/doctors.js"></script>
    <script src="js/appointments.js"></script>
    <script src="js/billing.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/ai-assistant.js"></script>
</body>

</html>
